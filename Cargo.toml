[package]
name = "macronx-tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "macronx-tui"
path = "src/main.rs"

[dependencies]
ratatui       = "0.28"
crossterm     = "0.28"
reqwest       = { version = "0.12", features = ["blocking", "json"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
anyhow        = "1"
tui-scrollview = "0.4"
unicode-width = "0.1"
ratatui-image = "2.0.1"
rodio = "0.22"
image = "0.25"
