[package]
name = "macronx-tui"
version = "1.0.0"
edition = "2021"
description = "A fast, keyboard-driven terminal user interface for MacronX OSINT pipeline"
license = "MIT"
repository = "https://github.com/macron1-automations/macronx-tui"
documentation = "https://github.com/macron1-automations/macronx-tui"
homepage = "https://github.com/macron1-automations/macronx-tui"

[[bin]]
name = "macronx-tui"
path = "src/main.rs"

[dependencies]
ratatui       = "0.28"
crossterm     = "0.28"
reqwest       = { version = "0.12", features = ["blocking"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
anyhow        = "1"
tui-scrollview = "0.4"
unicode-width = "0.1"
ratatui-image = "2.0.1"
rodio = "0.22"
image = "0.25"
arboard = { version = "3", features = ["wayland-data-control"] }
